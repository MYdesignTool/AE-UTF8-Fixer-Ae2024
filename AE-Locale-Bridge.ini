; Place beside !00_AE_Locale_Bridge.aex. Restart AE after changes.
[Bridge]
Enabled=1
; 0: Chinese and English AE UI; 1: English UI only. Unknown languages stay inactive.
OnlyEnglish=0
; auto: valid UTF-8 wins, otherwise try strict round-trip GBK with Han characters.
; gbk: allow non-Han GBK too; utf8: do not convert GBK.
SourceEncoding=auto
; auto: bidirectional UI text bridge for 24.x/25.x/26.0/26.1; UTF-8 for 26.2+.
; on/off: override this compatibility policy for host validation.
LegacyBridge=auto
