name: Build and test English AE bridge
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 with repository SDK
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DAE_SDK_PATH="$env:GITHUB_WORKSPACE/AE_SDK"
      - name: Compile
        run: cmake --build build --config Release -- /m:1 /nr:false
      - name: Run encoding and mock-host tests
        run: ctest --test-dir build -C Release --output-on-failure --timeout 45
      - name: Package runtime files only
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AE-Locale-Bridge-English-win64
          path: dist/AE-Locale-Bridge-English-0.2.2-win64.zip
          if-no-files-found: error
